buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

allprojects {
    apply plugin: 'idea'
    version = "v1.0.0"

    ext.androidCompileSdk = 35
    ext.androidMinSdk = 30
    ext.androidTargetSdk = 36
    ext.appVersionCode = 30
}

subprojects {
    group = 'org.microg'
    repositories {
        mavenCentral()
        google()
    }
}
